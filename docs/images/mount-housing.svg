<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Housing only: the housing holds every air space and the image plane</title>
  <defs>
    <marker id="aGlass" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2f6f99"/></marker>
    <marker id="aAl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4f5966"/></marker>
  </defs>
  <rect width="720" height="440" fill="#ffffff"/>

  <text x="20" y="26" font-size="16" font-weight="bold" fill="#222">1. The housing only</text>
  <text x="20" y="47" font-family="Consolas, Menlo, monospace" font-size="13" fill="#222">atherm focus fischer-ge-znse.zmx --housing aluminum-6061-t6</text>

  <!-- surface numbers -->
  <g fill="#222" text-anchor="middle" font-size="12">
    <text x="150" y="82">1</text><text x="182" y="82">2</text><text x="230" y="82">3</text><text x="256" y="82">4</text><text x="640" y="82">5 (image)</text>
  </g>

  <!-- housing: barrel, seats between the lenses, end plate -->
  <g fill="#b8bec6" stroke="#6b7480" stroke-width="1">
    <rect x="130" y="92" width="525" height="10"/>
    <rect x="130" y="298" width="525" height="10"/>
    <rect x="130" y="102" width="8" height="14"/><rect x="130" y="284" width="8" height="14"/>
    <rect x="193" y="102" width="14" height="16"/><rect x="193" y="282" width="14" height="16"/>
    <rect x="262" y="102" width="10" height="16"/><rect x="262" y="282" width="10" height="16"/>
    <rect x="645" y="102" width="10" height="196"/>
  </g>
  <text x="400" y="88" text-anchor="middle" fill="#4f5966" font-size="12">housing (aluminum)</text>

  <!-- the two lenses -->
  <g fill="#d7ecf7" stroke="#3c7aa3" stroke-width="1.2">
    <path d="M163.8,110 A300,300 0 0 0 163.8,290 L189.1,290 A450,450 0 0 1 189.1,110 Z"/>
    <path d="M210.75,110 A220,220 0 0 1 210.75,290 L237.5,290 A240,240 0 0 0 237.5,110 Z"/>
  </g>
  <text x="168" y="250" text-anchor="middle" font-size="11" fill="#2f6f99">Ge</text>
  <text x="226" y="250" text-anchor="middle" font-size="11" fill="#2f6f99">ZnSe</text>

  <!-- detector -->
  <rect x="636" y="165" width="9" height="70" fill="#333"/>
  <text x="628" y="252" text-anchor="end" font-size="12" fill="#222">detector</text>

  <!-- axis -->
  <line x1="110" y1="200" x2="690" y2="200" stroke="#888" stroke-dasharray="10 4 2 4"/>

  <!-- extension lines from the vertices -->
  <g stroke="#999" stroke-dasharray="3 3" stroke-width="0.8">
    <line x1="150" y1="200" x2="150" y2="362"/><line x1="180" y1="200" x2="180" y2="362"/>
    <line x1="230" y1="200" x2="230" y2="362"/><line x1="255" y1="200" x2="255" y2="362"/>
    <line x1="640" y1="235" x2="640" y2="362"/>
  </g>

  <!-- thicknesses -->
  <g stroke-width="1.6">
    <line x1="150" y1="350" x2="180" y2="350" stroke="#2f6f99" marker-start="url(#aGlass)" marker-end="url(#aGlass)"/>
    <line x1="180" y1="350" x2="230" y2="350" stroke="#4f5966" marker-start="url(#aAl)" marker-end="url(#aAl)"/>
    <line x1="230" y1="350" x2="255" y2="350" stroke="#2f6f99" marker-start="url(#aGlass)" marker-end="url(#aGlass)"/>
    <line x1="255" y1="350" x2="640" y2="350" stroke="#4f5966" marker-start="url(#aAl)" marker-end="url(#aAl)"/>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="165" y="376" fill="#2f6f99">t₁</text>
    <text x="205" y="376" fill="#4f5966">d₂</text>
    <text x="242" y="376" fill="#2f6f99">t₃</text>
    <text x="447" y="376" fill="#4f5966">d₄, to the image</text>
  </g>

  <text x="20" y="408" fill="#2f6f99">t₁, t₃: glass thicknesses; they grow with their glass.</text>
  <text x="20" y="428" fill="#4f5966">d₂, d₄: air spaces, vertex to vertex; the housing holds them, so they grow with aluminum.</text>
</svg>
