<svg xmlns="http://www.w3.org/2000/svg" width="696" height="664" viewBox="128 64 174 166" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="3.3">
  <title>A spacer touching both surfaces at a height h off the axis</title>
  <defs>
    <marker id="aK" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#222"/></marker>
    <marker id="aTi" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2f5f9e"/></marker>
  </defs>
  <rect x="128" y="64" width="174" height="166" fill="#ffffff"/>

  <text x="131" y="71" font-size="4" font-weight="bold" fill="#222">2. A spacer, touching the glass at height h</text>
  <text x="131" y="77.5" font-family="Consolas, Menlo, monospace" font-size="3.2" fill="#222">--spacer 2:ti-6al-4v:12    (the last number, 12, is h in mm)</text>

  <!-- housing wall -->
  <rect x="128" y="92" width="174" height="10" fill="#b8bec6" stroke="#6b7480" stroke-width="0.3"/>
  <text x="290" y="98.5" text-anchor="end" font-size="3" fill="#4f5966">housing</text>

  <!-- lenses (the upper halves show) -->
  <clipPath id="upper"><rect x="128" y="64" width="174" height="136"/></clipPath>
  <g fill="#d7ecf7" stroke="#3c7aa3" stroke-width="0.35" clip-path="url(#upper)">
    <path d="M163.8,110 A300,300 0 0 0 163.8,290 L189.1,290 A450,450 0 0 1 189.1,110 Z"/>
    <path d="M210.75,110 A220,220 0 0 1 210.75,290 L237.5,290 A240,240 0 0 0 237.5,110 Z"/>
  </g>
  <text x="166" y="120" text-anchor="middle" fill="#2f6f99">lens 1</text>
  <text x="226" y="120" text-anchor="middle" fill="#2f6f99">lens 2</text>
  <text x="176" y="88" text-anchor="middle" fill="#222">surface 2</text>
  <text x="232" y="88" text-anchor="middle" fill="#222">surface 3</text>
  <line x1="180" y1="89.5" x2="180" y2="92" stroke="#222" stroke-width="0.25"/>
  <line x1="230" y1="89.5" x2="230" y2="92" stroke="#222" stroke-width="0.25"/>

  <!-- the spacer: a ring, in section -->
  <path d="M185.48,130 L190.6,102 L206,102 L218.57,130 Z" fill="#7fa7da" stroke="#2f5f9e" stroke-width="0.35"/>
  <text x="200.5" y="112" text-anchor="middle" fill="#123a6b">spacer</text>
  <text x="200.5" y="116" text-anchor="middle" fill="#123a6b" font-size="2.8">(titanium)</text>
  <circle cx="185.48" cy="130" r="0.9" fill="#c0392b"/>
  <circle cx="218.57" cy="130" r="0.9" fill="#c0392b"/>
  <text x="200.5" y="128.7" text-anchor="middle" fill="#c0392b" font-size="2.8">contacts</text>

  <!-- axis and the vertex planes -->
  <line x1="128" y1="200" x2="302" y2="200" stroke="#888" stroke-width="0.3" stroke-dasharray="3 1.2 0.6 1.2"/>
  <text x="300" y="198" text-anchor="end" font-size="2.8" fill="#666">axis</text>
  <g stroke="#999" stroke-width="0.25" stroke-dasharray="1 1">
    <line x1="180" y1="200" x2="180" y2="134"/><line x1="230" y1="200" x2="230" y2="134"/>
    <line x1="185.48" y1="130" x2="185.48" y2="156"/><line x1="218.57" y1="130" x2="218.57" y2="156"/>
    <line x1="218.57" y1="130" x2="270" y2="130"/>
  </g>

  <!-- dimensions -->
  <g stroke-width="0.4">
    <line x1="185.48" y1="142" x2="218.57" y2="142" stroke="#2f5f9e" marker-start="url(#aTi)" marker-end="url(#aTi)"/>
    <line x1="180" y1="152" x2="185.48" y2="152" stroke="#222" marker-start="url(#aK)" marker-end="url(#aK)"/>
    <line x1="218.57" y1="152" x2="230" y2="152" stroke="#222" marker-start="url(#aK)" marker-end="url(#aK)"/>
    <line x1="180" y1="190" x2="230" y2="190" stroke="#222" marker-start="url(#aK)" marker-end="url(#aK)"/>
    <line x1="266" y1="200" x2="266" y2="130" stroke="#222" marker-start="url(#aK)" marker-end="url(#aK)"/>
  </g>
  <text x="202" y="140" text-anchor="middle" fill="#2f5f9e" font-weight="bold">L</text>
  <text x="178.5" y="153.2" text-anchor="end" fill="#222">sag₂(h)</text>
  <text x="231.5" y="153.2" fill="#222">sag₃(h)</text>
  <text x="205" y="187.5" text-anchor="middle" fill="#222">d₂, vertex to vertex</text>
  <text x="268.5" y="150" fill="#c0392b" font-weight="bold" font-size="3.8">h = 12 mm</text>
  <text x="268.5" y="156" fill="#222" font-size="3">the height of the</text>
  <text x="268.5" y="160" fill="#222" font-size="3">contacts, measured</text>
  <text x="268.5" y="164" fill="#222" font-size="3">from the axis, across</text>
  <text x="268.5" y="168" fill="#222" font-size="3">the lens (not along it)</text>

  <!-- what it means -->
  <text x="131" y="209" fill="#222"><tspan font-weight="bold" fill="#2f5f9e">L = d₂ + sag₃(h) − sag₂(h)</tspan>, the spacer's length between its contacts.</text>
  <text x="131" y="215" fill="#222">A sag is signed: positive when the surface at h lies to the right of its vertex.</text>
  <text x="131" y="221" fill="#222">At a temperature, L and h grow with the spacer, and the sags are those of the grown</text>
  <text x="131" y="227" fill="#222">surfaces, so d₂ follows the spacer and the change of the sags. At h = 0, d₂ = L.</text>
</svg>
