<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>A part that holds several surfaces: the last air space inside it takes up the rest</title>
  <defs>
    <marker id="aGlass" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2f6f99"/></marker>
    <marker id="aTi" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2f5f9e"/></marker>
    <marker id="aInv" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#a85f0a"/></marker>
  </defs>
  <rect width="720" height="500" fill="#ffffff"/>

  <text x="20" y="26" font-size="16" font-weight="bold" fill="#222">4. A part holding several surfaces, with a spacer inside it</text>
  <text x="20" y="47" font-family="Consolas, Menlo, monospace" font-size="13" fill="#222">--housing aluminum-6061-t6 --part 1-5:invar-36:12:0 --spacer 2:ti-6al-4v:12</text>

  <g fill="#222" text-anchor="middle" font-size="12">
    <text x="150" y="82">1</text><text x="182" y="82">2</text><text x="230" y="82">3</text><text x="256" y="82">4</text><text x="640" y="82">5 (image)</text>
  </g>

  <!-- Invar barrel: front seat on surface 1, walls, end plate: mount part 1-5 -->
  <g fill="#f0b56a" stroke="#b56d12" stroke-width="1">
    <rect x="130" y="92" width="525" height="10"/><rect x="130" y="298" width="525" height="10"/>
    <path d="M130,102 L156,102 L158.28,130 L130,130 Z"/>
    <path d="M130,298 L156,298 L158.28,270 L130,270 Z"/>
    <rect x="645" y="102" width="10" height="196"/>
  </g>
  <text x="400" y="88" text-anchor="middle" fill="#a85f0a" font-size="11">barrel (Invar): mount part 1-5</text>

  <!-- retainer: holds lens 2 against the spacer, sets no length -->
  <g fill="#555" stroke="#333" stroke-width="0.8">
    <rect x="249" y="102" width="8" height="14"/><rect x="249" y="284" width="8" height="14"/>
  </g>
  <text x="262" y="125" fill="#555" font-size="10">retainer</text>

  <g fill="#d7ecf7" stroke="#3c7aa3" stroke-width="1.2">
    <path d="M163.8,110 A300,300 0 0 0 163.8,290 L189.1,290 A450,450 0 0 1 189.1,110 Z"/>
    <path d="M210.75,110 A220,220 0 0 1 210.75,290 L237.5,290 A240,240 0 0 0 237.5,110 Z"/>
  </g>

  <g fill="#7fa7da" stroke="#2f5f9e" stroke-width="1">
    <path d="M185.48,130 L190.6,102 L206,102 L218.57,130 Z"/>
    <path d="M185.48,270 L190.6,298 L206,298 L218.57,270 Z"/>
  </g>
  <text x="202" y="124" text-anchor="middle" fill="#123a6b" font-size="10">Ti</text>

  <g fill="#c0392b">
    <circle cx="158.28" cy="130" r="2.5"/><circle cx="185.48" cy="130" r="2.5"/><circle cx="218.57" cy="130" r="2.5"/>
    <circle cx="158.28" cy="270" r="2.5"/><circle cx="185.48" cy="270" r="2.5"/><circle cx="218.57" cy="270" r="2.5"/>
  </g>

  <rect x="636" y="165" width="9" height="70" fill="#333"/>
  <text x="628" y="252" text-anchor="end" font-size="12" fill="#222">detector</text>

  <line x1="110" y1="200" x2="690" y2="200" stroke="#888" stroke-dasharray="10 4 2 4"/>
  <g stroke="#999" stroke-dasharray="3 3" stroke-width="0.8">
    <line x1="158.28" y1="130" x2="158.28" y2="342"/>
    <line x1="150" y1="200" x2="150" y2="377"/><line x1="180" y1="200" x2="180" y2="377"/>
    <line x1="230" y1="200" x2="230" y2="377"/><line x1="255" y1="200" x2="255" y2="377"/>
    <line x1="640" y1="235" x2="640" y2="377"/>
  </g>

  <!-- the part's length -->
  <line x1="158.28" y1="332" x2="640" y2="332" stroke="#a85f0a" stroke-width="1.6" marker-start="url(#aInv)" marker-end="url(#aInv)"/>
  <text x="400" y="326" text-anchor="middle" fill="#a85f0a" font-size="12">the part's length, surface 1 at 12 mm to the image: grows with Invar</text>

  <!-- what is inside it -->
  <g stroke-width="1.6">
    <line x1="150" y1="365" x2="180" y2="365" stroke="#2f6f99" marker-start="url(#aGlass)" marker-end="url(#aGlass)"/>
    <line x1="180" y1="365" x2="230" y2="365" stroke="#2f5f9e" marker-start="url(#aTi)" marker-end="url(#aTi)"/>
    <line x1="230" y1="365" x2="255" y2="365" stroke="#2f6f99" marker-start="url(#aGlass)" marker-end="url(#aGlass)"/>
    <line x1="255" y1="365" x2="640" y2="365" stroke="#a85f0a" stroke-dasharray="6 3" marker-start="url(#aInv)" marker-end="url(#aInv)"/>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="165" y="391" fill="#2f6f99">t₁</text>
    <text x="205" y="391" fill="#2f5f9e">d₂</text>
    <text x="242" y="391" fill="#2f6f99">t₃</text>
    <text x="447" y="391" fill="#a85f0a">d₄ = the rest (the free space)</text>
  </g>

  <text x="20" y="420" fill="#222">Inside the part, t₁ and t₃ grow with their glasses, and d₂ with the titanium spacer. d₄, the last air space</text>
  <text x="20" y="439" fill="#222">in the part that no inner part holds, is whatever is left of the part's length.</text>
  <text x="20" y="458" fill="#222">So the Invar sets the detector's place: when the spacer grows, it pushes lens 2 back and d₄ shortens.</text>
  <text x="20" y="477" fill="#555">The retainer only keeps lens 2 against the spacer; it sets no length, so it is not in the mount.</text>
</svg>
