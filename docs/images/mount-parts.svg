<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>A spacer and a mount part: each air space follows the part that holds it</title>
  <defs>
    <marker id="aGlass" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2f6f99"/></marker>
    <marker id="aTi" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2f5f9e"/></marker>
    <marker id="aInv" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#a85f0a"/></marker>
  </defs>
  <rect width="720" height="470" fill="#ffffff"/>

  <text x="20" y="26" font-size="16" font-weight="bold" fill="#222">3. A spacer and a mount part</text>
  <text x="20" y="47" font-family="Consolas, Menlo, monospace" font-size="13" fill="#222">--housing aluminum-6061-t6 --spacer 2:ti-6al-4v:12 --part 4-5:invar-36:12:0</text>

  <g fill="#222" text-anchor="middle" font-size="12">
    <text x="150" y="82">1</text><text x="182" y="82">2</text><text x="230" y="82">3</text><text x="256" y="82">4</text><text x="640" y="82">5 (image)</text>
  </g>

  <!-- aluminum lens cell: the housing -->
  <g fill="#b8bec6" stroke="#6b7480" stroke-width="1">
    <rect x="130" y="92" width="140" height="10"/><rect x="130" y="298" width="140" height="10"/>
    <rect x="130" y="102" width="8" height="14"/><rect x="130" y="284" width="8" height="14"/>
  </g>
  <text x="135" y="326" fill="#4f5966" font-size="11">lens cell (aluminum, the housing)</text>

  <!-- Invar tube from the seat on surface 4 to the detector: mount part 4-5 -->
  <g fill="#f0b56a" stroke="#b56d12" stroke-width="1">
    <rect x="262" y="86" width="393" height="10"/><rect x="262" y="304" width="393" height="10"/>
    <rect x="645" y="96" width="10" height="208"/>
    <path d="M244.56,130 L249,102 L262,102 L262,130 Z"/>
    <path d="M244.56,270 L249,298 L262,298 L262,270 Z"/>
  </g>
  <text x="450" y="80" text-anchor="middle" fill="#a85f0a" font-size="11">detector tube (Invar): mount part 4-5</text>

  <!-- lenses -->
  <g fill="#d7ecf7" stroke="#3c7aa3" stroke-width="1.2">
    <path d="M163.8,110 A300,300 0 0 0 163.8,290 L189.1,290 A450,450 0 0 1 189.1,110 Z"/>
    <path d="M210.75,110 A220,220 0 0 1 210.75,290 L237.5,290 A240,240 0 0 0 237.5,110 Z"/>
  </g>

  <!-- titanium spacer between the lenses -->
  <g fill="#7fa7da" stroke="#2f5f9e" stroke-width="1">
    <path d="M185.48,130 L190.6,102 L206,102 L218.57,130 Z"/>
    <path d="M185.48,270 L190.6,298 L206,298 L218.57,270 Z"/>
  </g>
  <text x="202" y="124" text-anchor="middle" fill="#123a6b" font-size="10">Ti</text>

  <!-- contacts -->
  <g fill="#c0392b">
    <circle cx="185.48" cy="130" r="2.5"/><circle cx="218.57" cy="130" r="2.5"/><circle cx="244.56" cy="130" r="2.5"/>
    <circle cx="185.48" cy="270" r="2.5"/><circle cx="218.57" cy="270" r="2.5"/><circle cx="244.56" cy="270" r="2.5"/>
  </g>

  <rect x="636" y="165" width="9" height="70" fill="#333"/>
  <text x="628" y="252" text-anchor="end" font-size="12" fill="#222">detector</text>

  <line x1="110" y1="200" x2="690" y2="200" stroke="#888" stroke-dasharray="10 4 2 4"/>
  <g stroke="#999" stroke-dasharray="3 3" stroke-width="0.8">
    <line x1="150" y1="200" x2="150" y2="362"/><line x1="180" y1="200" x2="180" y2="362"/>
    <line x1="230" y1="200" x2="230" y2="362"/><line x1="255" y1="200" x2="255" y2="362"/>
    <line x1="640" y1="235" x2="640" y2="362"/>
  </g>

  <g stroke-width="1.6">
    <line x1="150" y1="350" x2="180" y2="350" stroke="#2f6f99" marker-start="url(#aGlass)" marker-end="url(#aGlass)"/>
    <line x1="180" y1="350" x2="230" y2="350" stroke="#2f5f9e" marker-start="url(#aTi)" marker-end="url(#aTi)"/>
    <line x1="230" y1="350" x2="255" y2="350" stroke="#2f6f99" marker-start="url(#aGlass)" marker-end="url(#aGlass)"/>
    <line x1="255" y1="350" x2="640" y2="350" stroke="#a85f0a" marker-start="url(#aInv)" marker-end="url(#aInv)"/>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="165" y="376" fill="#2f6f99">t₁</text>
    <text x="205" y="376" fill="#2f5f9e">d₂</text>
    <text x="242" y="376" fill="#2f6f99">t₃</text>
    <text x="447" y="376" fill="#a85f0a">d₄, to the image</text>
  </g>

  <text x="20" y="404" fill="#2f5f9e">d₂: set by the titanium spacer, which touches surfaces 2 and 3 at 12 mm.</text>
  <text x="20" y="423" fill="#a85f0a">d₄: set by the Invar tube, which touches surface 4 at 12 mm and holds the image plane (surface 5, at 0).</text>
  <text x="20" y="442" fill="#4f5966">The aluminum cell holds no air space here, since every one has a part: its contribution is 0.</text>
  <text x="20" y="461" fill="#c0392b">● contacts: where each part touches the glass.</text>
</svg>
